[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcastbrain"
version = "1.0.0"
description = "Autonomous media ingestion pipeline that turns archived television into a Fieldstation 42 library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BroadcastBrain" }]

# Core dependencies only. Everything AI/GPU related is an optional extra so the
# pipeline can run (and be tested) on a machine with nothing but ffmpeg.
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# --- Runtime capability groups -------------------------------------------------
# Each group is independently installable. Analyzers detect their backend at
# runtime and record `skipped/backend-missing` instead of failing, so a clip
# processed today can be re-analyzed tomorrow once the backend is installed.
dashboard = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "psutil>=5.9"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.24", "Pillow>=10.0"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
speech = ["faster-whisper>=1.0"]
faces = ["insightface>=0.7", "onnxruntime>=1.17"]
objects = ["ultralytics>=8.1"]
embeddings = ["sentence-transformers>=2.5", "numpy>=1.24"]
audioid = ["pyacoustid>=1.3"]
archive = ["internetarchive>=3.6"]
gpu = ["nvidia-ml-py>=12.535"]
postgres = ["psycopg[binary]>=3.1", "alembic>=1.13"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "mypy>=1.8", "ruff>=0.3"]

# Everything except GPU-vendor specifics; what a full overnight box wants.
all = [
    "broadcastbrain[dashboard,vision,ocr,speech,faces,objects,embeddings,audioid,archive]",
]

[project.scripts]
bb = "broadcastbrain.cli:main"
broadcastbrain = "broadcastbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
broadcastbrain = ["dashboard/static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that shell out to ffmpeg or download models",
    "requires_ffmpeg: needs a real ffmpeg/ffprobe on PATH",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.9"
packages = ["broadcastbrain"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "cv2.*", "insightface.*", "ultralytics.*", "faster_whisper.*",
    "pytesseract.*", "acoustid.*", "internetarchive.*", "psutil.*",
    "sentence_transformers.*", "pynvml.*", "PIL.*", "numpy.*",
    "fastapi.*", "uvicorn.*", "starlette.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FastAPI is an optional dependency. When it is absent mypy sees its route
# decorators as `Any` and flags every endpoint as "untyped decorator" -- a
# statement about the environment, not about this code. The dashboard's own
# types are still checked; only that one strictness flag is relaxed.
module = ["broadcastbrain.dashboard.*"]
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter, not by hand
    # `Optional[X]` rather than `X | None`, deliberately: SQLAlchemy's
    # `Mapped[...]` and pydantic both *evaluate* these annotations at runtime,
    # and PEP 604 unions are a syntax error there on Python 3.9.
    "UP007", "UP045", "UP035",
    # Typer declares CLI options as call expressions in default arguments;
    # that is the framework's documented API, not a bug.
    "B008",
    # `os.replace`/`os.stat` are used on purpose in the atomic-write helpers:
    # `Path.replace` gives no extra safety and `os.stat` avoids building a
    # Path object per file when walking a 100 TB library.
    "PTH105", "PTH116", "PTH118",
    # Protocol and base-class methods legitimately ignore arguments.
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
